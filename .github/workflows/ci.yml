name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository and use no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (build and test)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The macos-26 image ships several Xcode 26.x versions; pick the newest one
      # explicitly so the Swift 6.2 toolchain is used, whatever the image default is.
      - name: Select Xcode 26
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No /Applications/Xcode_26*.app found on this runner" >&2
            exit 1
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Run package tests
        shell: bash
        run: |
          swift test --package-path BandwidthECGPackage 2>&1 | tee swift-test.log
          # A run can discover 0 tests and still exit 0, so require a non-zero count.
          grep -E 'Test run with [1-9][0-9]* tests' swift-test.log

      - name: Build the app (Debug)
        run: ./build.sh

  website:
    name: Website (build and i18n check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check i18n (key sets, banned wording, built HTML)
        run: node scripts/check-i18n.mjs --dist
